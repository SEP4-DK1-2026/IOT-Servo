name: Run WindowShouldOpenTest

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Compile WindowShouldOpenTest
        run: |
          gcc -o WindowShouldOpenTest \
          test/WindowShouldOpenTest.c \
          lib/drivers/windowopener.c \
          lib/drivers/unity.c \
          -Ilib/drivers -Isrc

      - name: Run WindowShouldOpen tests
        run: ./WindowShouldOpenTest